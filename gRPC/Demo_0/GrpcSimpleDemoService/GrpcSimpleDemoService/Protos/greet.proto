syntax = "proto3";

option csharp_namespace = "GrpcSimpleDemoService";

package greet;

// The greeting service definition.
service Greeter {   //It is a Unary call. -- single request gets single response.
  // Sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply);
}

// The request message containing the user's name.
message HelloRequest {
  string name = 1;
}

// The response message containing the greetings.
message HelloReply {
  string message = 1;
}
