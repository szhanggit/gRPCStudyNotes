syntax = "proto3";

package greet;

// The greeting service definition.
service GreeterMultiVerionRpcSet {
  rpc SayHello (HelloRequest) returns (HelloReply) { 
  };
}

// The request message containing the user's name as deprecated field and first_name-last_name as new field.
message HelloRequest {
	string name = 1 [deprecated = true]; //Marked as deprecated, c# compiler shows warning
	string first_name = 2;
	string last_name = 3;
}

// The response message containing the greetings.
message HelloReply {
  string message = 1;
}